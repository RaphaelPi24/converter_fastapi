services:
  fastapi:
    build:
      context: ..
      dockerfile: build/backend/prod.Dockerfile
    networks:
      converter_nginx:
        ipv4_address: 10.6.6.7
    restart: on-failure


  worker:
    build:
      context: ..
      dockerfile: build/backend/prod.Dockerfile
    networks:
      converter_nginx:
        ipv4_address: 10.6.6.2
    restart: on-failure

  converter_db:
    networks:
      converter_nginx:
        ipv4_address: 10.6.6.3
    restart: on-failure

  redis:
    networks:
      converter_nginx:
        ipv4_address: 10.6.6.4
    restart: on-failure

networks:
  converter_nginx:
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.6.0/24
          gateway: 10.6.6.1
